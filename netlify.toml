[build]
  command = "pnpm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

# Keep generated HTML unchanged: the CSP hashes match the exported scripts.
[build.processing]
  skip_processing = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200
